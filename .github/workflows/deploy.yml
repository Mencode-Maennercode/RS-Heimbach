name: Build & Deploy (SFTP)

# Baut die statische Seite und laedt sie per SFTP auf den IONOS-Webspace.
# - taeglich nachts: holt frische Kalender-Termine aus der Nextcloud-.ics
# - manuell ("Run workflow"-Knopf in GitHub): fuer Eilfaelle, in ~2 Min. live
# - workflow_dispatch wird ausserdem automatisch von sheets-sync.yml und
#   instagram-sync.yml aufgerufen, sobald die dort geholten Daten sich
#   geaendert haben (siehe Kommentar dort, warum das kein push-Trigger sein kann)
#
# WICHTIG: Der IONOS-Webspace bietet nur SFTP-Konten (Port 22, SSH-Protokoll)
# an, kein klassisches FTP/FTPS. Deshalb wlixcc/SFTP-Deploy-Action statt der
# frueher genutzten FTP-Deploy-Action -- die spricht ein anderes Protokoll
# und wuerde mit diesen Zugangsdaten nicht funktionieren.
#
# server-dir zeigt auf /clickandbuilds/testheimbach -- das ist der Ordner,
# auf den rs-heimbach.de aktuell zeigt (Stand 01.09.2026, siehe Migrations-
# plan). Es wird bewusst NICHT geloescht+neu hochgeladen (kein
# delete_remote_files), damit die Live-Seite waehrend eines Deploys nie
# kurzzeitig leer/kaputt ist. Verwaiste Alt-Dateien bleiben liegen, das ist
# fuer eine kleine Schulseite unkritisch.
on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC = ~04:00/05:00 DE-Zeit (Winter/Sommer)
  workflow_dispatch:
  push:
    branches: [master] # bei Code-Aenderungen auf master ebenfalls neu deployen

# Verhindert, dass sich parallele Deploys ueberholen.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Statische Seite bauen (erzeugt ./out)
        run: npm run build

      # Seit 09.11.2026 laeuft die Seite auf dem Hetzner-Server der IT-Firma
      # (nginx, Let's-Encrypt-Zertifikat dort). Upload per rsync ueber SSH mit
      # Schluessel; ohne --delete, damit die Seite waehrend des Deploys nie
      # kurzzeitig unvollstaendig ist.
      - name: Per rsync/SSH hochladen
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          rsync -rltz --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/deploy_key -p 66" \
            ./out/ webadmin@178.63.8.82:/srv/website/
