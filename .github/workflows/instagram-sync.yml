name: Instagram Sync

# Holt alle 10 Minuten die aktuellen Instagram-Posts und committet sie nach
# public/data/instagram.json (nur bei tatsaechlicher Aenderung) - bei 1-2
# neuen Posts/Woche bleibt das selten und kostenlos.
#
# WICHTIG: Ein Push, der mit dem automatischen GITHUB_TOKEN einer Action
# erstellt wird, loest bei GitHub NIE den push-Trigger einer anderen Action
# aus (Schutz vor Endlosschleifen) -- "Build & Deploy (SFTP)" wuerde also
# NICHT automatisch anspringen. Deshalb wird es hier explizit per
# workflow_dispatch angestossen, aber nur wenn sich tatsaechlich etwas
# geaendert hat.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: instagram-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # sharp wird zum Verkleinern der Bilder gebraucht. npm ci ist durch den
      # Cache schnell; die Bilder selbst werden nur bei neuen Posts geladen.
      - run: npm ci

      - name: Instagram-Daten abrufen
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: node scripts/instagram-sync.mjs

      - name: Aenderungen committen
        id: commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/data/instagram.json public/data/instagram
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: Instagram-Daten aktualisiert"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: IONOS-Deploy anstossen
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref master
